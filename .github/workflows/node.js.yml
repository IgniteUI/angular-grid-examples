# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "vnext", "master" ]
  pull_request:
    branches: [ "vnext", "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x, 26.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm ci
    - run: npm run build --if-present
      env:
        # The Angular build runs close to the runner's 16 GB. Its bundler (esbuild, a Go program) lets its heap
        # grow far beyond its live data on a 4-vCPU runner; this soft limit makes the Go garbage collector
        # keep it near 10 GiB. Only esbuild reads GOMEMLIMIT.
        GOMEMLIMIT: 10GiB
