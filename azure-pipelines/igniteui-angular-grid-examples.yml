trigger:
  branches:
    include:
    - vnext
    - master

# This pipeline is meant to build specific branches for deployment. It's not meant to be a part of PR validation.
pr: none

parameters:
- name: isVerbose
  displayName: 'Get verbose output from steps - where configurable'
  type: boolean
  default: false
- name: shouldCleanPostExecution
  displayName: 'Clean all pipeline dirs after the pipeline finishes?'
  type: boolean
  default: true


name: $(Year:yyyy).$(Month).$(DayOfMonth)-r$(Rev:.r)

stages:
- stage: Build
  pool:
    vmImage: ubuntu-latest

    demands: npm
  jobs:
  - job: BuildSamples
    steps:
      - checkout: 'self'
        clean: true

      - task: NodeTool@0
        displayName: 'Install Node'
        inputs:
          versionSource: 'spec'
          versionSpec: '24.x'

      - task: Bash@3
        displayName: 'Create download artifact per sample (Shell)'
        inputs:
          targetType: 'inline'
          script: |
            create_zips() {
              local rootPath="$1"
              if [ -d "$rootPath" ]; then
                # Get all first-level subdirectories in the specified root path
                subdirectories=$(find "$rootPath" -mindepth 1 -maxdepth 1 -type d)
                for subdirectory in $subdirectories; do
                  # Extract the directory name from the path
                  dirName=$(basename "$subdirectory")

                  # Give each sample a version in its package.json file - for traceability
                  cd "$subdirectory"
                  echo "Setting project version in package.json to $(Build.BuildNumber) for $dirName"
                  npm version $(Build.BuildNumber) --no-git-tag-version

                  # Check if the directory name is already camel-case
                  if [[ "$dirName" =~ ^[A-Z]+[a-z]+([A-Z][a-z]*)*$ ]]; then
                      # If already camel-case, print it as is
                      echo "$dirName"
                  else
                      # Convert to camel-case (capitalize first letters and remove hyphens)
                      dirName=$(echo "$dirName" | sed -E 's/(^|-)([a-z])/\U\2/g')
                  fi

                  echo "Processing directory: $dirName"
                  # Define the name for the zip file
                  zipName="$(Build.ArtifactStagingDirectory)/IgniteUI_Angular_ApplicationSample_${dirName}_Source.zip"
                  echo "Creating ZIP: $zipName"

                  # Compress the directory into a ZIP file
                  (cd "$subdirectory" && zip -r "$zipName" .)
                done
              fi
            }

            # Pass 1: All first-level directories in projects/
            create_zips "$(Build.SourcesDirectory)/projects"

            # Pass 2: All first-level directories in projects/charts/
            create_zips "$(Build.SourcesDirectory)/projects/charts"

            echo "All sample projects have been compressed and saved to the artifacts directory."

      - task: PublishPipelineArtifact@1
        displayName: 'Publish Samples Sources zips'
        inputs:
          targetPath: '$(Build.ArtifactStagingDirectory)'
          artifact: 'samplesSourcesZips'
          publishLocation: 'pipeline'

      - task: Npm@1
        displayName: 'Npm install'
        inputs:
          command: 'install'

      - task: Npm@1
        displayName: 'Install @angular/cli globally'
        inputs:
          verbose: ${{ parameters.isVerbose }}
          command: custom
          workingDir: '$(Build.SourcesDirectory)'
          customCommand: 'install -g @angular/cli'


      - task: Npm@1
        displayName: 'Register licensed npm registry in .npmrc'
        inputs:
          verbose: ${{ parameters.isVerbose }}
          command: 'custom'
          workingDir: '$(Build.SourcesDirectory)'
          customCommand: 'config -L project set @infragistics:registry=https://packages.infragistics.com/npm/js-licensed/'
      - task: npmAuthenticate@0
        displayName: '[IG Production ProGet] npm authenticate'
        inputs:
          workingFile: '$(Build.SourcesDirectory)/.npmrc'
          customEndpoint: 'public proget'

      - task: PowerShell@2
        displayName: 'Run Angular Schematics Upgrade Packages'
        inputs:
          targetType: 'inline'
          script: |
            npx --userconfig=$(Build.SourcesDirectory)/.npmrc --legacy-peer-deps ng g @igniteui/angular-schematics:upgrade-packages

      - task: Npm@1
        displayName: 'npm run build:ci (browser only)'
        inputs:
          command: custom
          workingDir: '$(Build.SourcesDirectory)'
          verbose: ${{ parameters.isVerbose }}
          # IIS serves the static browser output only, so skip the server bundle and
          # route prerendering. `production` must be listed explicitly - naming a
          # configuration replaces the default one, which would drop output hashing.
          customCommand: 'run build:ci -- --configuration production,browser-only'
        env:
          # The build exhausts the ~7.9GB Microsoft-hosted agent ("Free memory is lower
          # than 5%") and intermittently stalls until Azure reports "We stopped hearing
          # from agent" - see #171. esbuild runs as a separate Go process, so Node-side
          # settings (worker count, heap size) do not bound its memory - GOMEMLIMIT/GOGC
          # do. These values are reused from another Ignite UI pipeline where they keep
          # a similar Angular build stable; they are not yet tuned for this agent size.
          GOMEMLIMIT: '6GiB'
          GOGC: '50'
          NODE_OPTIONS: '--max_old_space_size=4096'

      - task: PublishPipelineArtifact@1

        displayName: 'Publish app'
        inputs:
          targetPath: '$(Build.SourcesDirectory)/dist/angular-grid-examples/browser'
          artifact: 'dist.angular-grid-examples.browser'
          publishLocation: 'pipeline'

      - ${{ if eq(parameters.shouldCleanPostExecution, true) }}:
        - task: PostBuildCleanup@4
